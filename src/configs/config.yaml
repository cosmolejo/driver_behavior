defaults:
  - override hydra/sweeper: optuna

hydra:
  run:
    dir: experiments/${now:%Y-%m-%d}/${now:%H-%M-%S}

  sweep:
    dir: experiments/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

  #sweeper:
#
#    direction: "minimize"
#    study_name: null
#    storage: "sqlite:///tmp.db"
#    n_trials: 20
#    n_jobs: 2


exp_name: exp_0
trainer: safe_driving


cuda: true
gpu_device: 0
seed: 306638



backbone_model: mobilenet_v3_small

setup:
  mode: multicamera
  step: train
temporal_model:
  model: LSTM
  input_size: default
  hidden_size: default
  num_layers: 2
  bidirectional: true
  batch_first: true

model:
  name: classifier
  num_classes: 4
  model_type: temporal

window_size: 15
stride: 1



batch_size: 64
test_batch_size: 256

learning_rate: 0.001

momentum: 0.5

weight_decay: 0
beta1: 0.5
beta2: 0.999

max_epoch: 50

log_interval: 10

validate_every: 2

checkpoint_file: checkpoint_face.pth.tar
camera: face

data_module: dmd
num_workers: 4
pin_memory: true
async_loading: true

data_mode: train_test_val
#data_path: /home/agomez/Documents/Vicomtech/
data_path: /mnt/c/Users/alejandro.gomez/Documents/Vicomtech/
#label_path: /home/agomez/Documents/driver_behavior/datasets/
label_path: /mnt/c/Users/alejandro.gomez/Documents/driver_behavior/datasets/
