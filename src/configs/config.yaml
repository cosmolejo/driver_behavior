defaults:
  - override hydra/sweeper: optuna

hydra:
  run:
    dir: experiments/${now:%Y-%m-%d}/${now:%H-%M-%S}

  sweep:
    dir: experiments=/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

  #sweeper:
#
#    direction: "minimize"
#    study_name: null
#    storage: "sqlite:///tmp.db"
#    n_trials: 20
#    n_jobs: 2


exp_name: exp_0



cuda: true
gpu_device: 0
seed: 306638



backbone_model: mobilenet_v3_small

setup:
  mode: body
  step: train
  trainer: safe_driving
  optimizer:
    learning_rate: 0.0001
    momentum: 0.5
    weight_decay: 0
    beta1: 0.5
    beta2: 0.999


temporal_model:
  model: LSTM
  input_size: default
  hidden_size: default
  num_layers: 2
  bidirectional: true
  batch_first: true

model:
  name: classifier
  num_classes: 4
  type: temporal

window_size: 15
stride: 1


batch_size: 8
test_batch_size: 16
early_stopping_delta: 0.0001
max_epoch: 25

log_interval: 10

validate_every: 2

checkpoint_file: checkpoint_body
camera: body

data_module: dmd
num_workers: 2
pin_memory: true
async_loading: true

data_mode: train_test_val
data_path: /home/agomez/Documents/Vicomtech/
# data_path: /mnt/c/Users/alejandro.gomez/Documents/Vicomtech/
label_path: /home/agomez/Documents/driver_behavior/datasets/
# label_path: /mnt/c/Users/alejandro.gomez/Documents/driver_behavior/datasets/
