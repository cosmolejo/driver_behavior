defaults:
  - override hydra/sweeper: optuna
  - override hydra/launcher: joblib

hydra:
  # Cada trial corre en su propia carpeta de salida. Asi load_checkpoint() siempre
  # da FileNotFoundError -> cada trial arranca de cero y guarda su checkpoint
  # aislado, en vez de heredar pesos/optimizer de un trial anterior via
  # pretrained_weights/ (que rompia el barrido en silencio).
  job:
    chdir: true

  run:
    dir: experiments/${now:%Y-%m-%d}/${now:%H-%M-%S}

  sweep:
    dir: experiments/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

  # Ejecucion paralela REAL de los trials.
  # Requiere: pip install hydra-joblib-launcher
  # Con el launcher por defecto (basic), n_jobs NO paraleliza: corre en secuencia.
  launcher:
    n_jobs: 2

  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${seed}
    direction: minimize          # minimizamos el test-loss (best_loss)
    study_name: ${exp_name}
    storage: sqlite:///optuna_${exp_name}.db   # persistencia -> permite reanudar el estudio
    n_trials: 20
    n_jobs: 2                     # trials muestreados por tanda (= paralelismo con joblib)
    params:
      setup.optimizer.learning_rate: tag(log, interval(1e-5, 1e-2))
      setup.optimizer.weight_decay: tag(log, interval(1e-6, 1e-2))
      setup.optimizer.beta1: interval(0.5, 0.95)
      temporal_model.num_layers: int(interval(1, 4))   # entero 1..4 inclusive


exp_name: exp_0



cuda: true
gpu_device: 0
seed: 306638



backbone_model: mobilenet_v3_small

setup:
  mode: body
  step: train
  trainer: safe_driving
  optimizer:
    learning_rate: 0.0001
    momentum: 0.5
    weight_decay: 0
    beta1: 0.5
    beta2: 0.999


temporal_model:
  model: LSTM
  input_size: default
  hidden_size: default
  num_layers: 2
  bidirectional: true
  batch_first: true

model:
  name: classifier
  num_classes: 3
  type: temporal

window_size: 15
stride: 1


batch_size: 64
test_batch_size: 128
early_stopping_delta: 0.0001
max_epoch: 9   # el bucle usa range(0, max_epoch+1) -> 10 epochs reales

log_interval: 10

validate_every: 2

checkpoint_file: checkpoint_face
camera: face

data_module: dmd
num_workers: 1
pin_memory: true
async_loading: true
frames_are_rgb: false
data_mode: train_test_val
