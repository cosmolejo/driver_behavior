defaults:
  - override hydra/sweeper: optuna

hydra:
  run:
    dir: experiments/${now:%Y-%m-%d}/${now:%H-%M-%S}

  sweep:
    dir: experiments/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

  #sweeper:
#
#    direction: "minimize"
#    study_name: null
#    storage: "sqlite:///tmp.db"
#    n_trials: 20
#    n_jobs: 2


exp_name: exp_0
trainer: safe_driving
mode: train

cuda: true
gpu_device: 0
seed: 306638



backbone_model: mobilenet_v3_small


temporal_model:
  model: LSTM
  input_size: default
  hidden_size: default
  num_layers: 2
  bidirectional: true
  batch_first: true


window_size: 15
model_type: temporal
model:
  name: static_classifier
  num_classes: 4

batch_size: 8
test_batch_size: 10

learning_rate: 0.001

momentum: 0.5

weight_decay: 0
beta1: 0.5
beta2: 0.999

max_epoch: 15

log_interval: 10

validate_every: 2

checkpoint_file: checkpoint.pth.tar

data_module: drive_and_act
num_workers: 2
pin_memory: true
async_loading: true

data_mode: train_test
data_path: /home/antares/Tesis_Data/Drive_and_Act/kinect_color
label_path: /home/antares/driver_behavior/datasets/
