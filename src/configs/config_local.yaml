defaults:
  - override hydra/sweeper: optuna

hydra:
  run:
    dir: experiments/${now:%Y-%m-%d}/${now:%H-%M-%S}

  sweep:
    dir: experiments/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

  #sweeper:
#
#    direction: "minimize"
#    study_name: null
#    storage: "sqlite:///tmp.db"
#    n_trials: 20
#    n_jobs: 2


exp_name: exp_0
trainer: safe_driving
mode: train

cuda: true
gpu_device: 0
seed: 306638



backbone_model: mobilenet_v3_small


temporal_model:
  model: LSTM
  input_size: default
  hidden_size: default
  num_layers: 2
  bidirectional: true
  batch_first: true


window_size: 15
stride: 1
model_type: temporal
model:
  name: classifier
  num_classes: 4

batch_size: 8
test_batch_size: 16

learning_rate: 0.001

momentum: 0.5

weight_decay: 0
beta1: 0.5
beta2: 0.999

max_epoch: 50

log_interval: 10

validate_every: 2

checkpoint_file: checkpoint_face.pth.tar
camera: face

data_module: dmd
num_workers: 2
pin_memory: true
async_loading: true

data_mode: train_test_val
data_path: /home/antares/Tesis_Data/Vicomtech/
#/home/agomez/Documents/Vicomtech/
#/mnt/c/Users/alejandro.gomez/Documents/Vicomtech/
label_path: /home/antares/driver_behavior/datasets/
#/home/agomez/Documents/driver_behavior/datasets/
