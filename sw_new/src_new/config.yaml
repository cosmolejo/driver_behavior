data_dir: /home/antares/Tesis_Data/dmd_user_split
num_classes: 3
sequence_length: 32  # ventanas largas; segmentos más cortos usan todos sus frames
sample_one_each: 2

# Antes: batch_size (windows por batch, mezcladas entre segmentos).
# Ahora la loss se promedia por segmento antes del backward, así que estos
# dos parámetros reemplazan a batch_size:
accumulation_steps: 4       # segmentos acumulados antes de cada optimizer.step()
max_windows_per_forward: 8  # tope de windows por forward (memoria), no cambia el resultado

num_epochs: 50
loss_fn: ???
lr: 1e-4
weight_decay: 1e-4
pct_start: 0.1
div_factor: 25

# --- Solo usados por optuna_search.py, no por main.py ---
optuna:
  study_name: driver_behavior_search
  storage: sqlite:///optuna_study.db
  n_trials: 50
  search_epochs: 12   # épocas reducidas durante la búsqueda
  final_epochs: 50    # épocas completas para retrain_best.py
  pruner_min_resource: 3
  pruner_reduction_factor: 3